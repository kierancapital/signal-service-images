<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free guides from our videos · Signal Service</title>
<meta name="description" content="A free guide for every Signal Service video, newest first. Search for the one you saw.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Guides list v2 (2026-11-15; called "prompts" until Kieran renamed it "guides" the same day, Kieran: "looks a little tacky… I prefer the style we had last time, just a more neat and minimal
   version"). The signalservice.ai look: white page, Inter, black type, light grey rounded rows, one green accent. One thin row
   per kit, newest first, live search. Published as kits/_hub.html (publish_kit.py --hub); the Worker serves it at /prompts and
   fills the KITS slot from kits/index.json (publish_kit.py rebuilds it from every data/<slug>.json with a "hub" block). */
:root{--ink:#0A0A0A;--soft:#5F5F5F;--faint:#9A9A9A;--row:#F4F4F4;--rowhover:#ECECEC;--green:#00D97E;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto;padding:36px 16px 48px}
header{text-align:center;margin:0 0 22px}
.logo{display:inline-block;width:52px;height:52px;border-radius:13px;overflow:hidden;margin:0 0 14px}
.logo img{width:100%;height:100%;display:block}
h1{font-size:30px;line-height:1.12;letter-spacing:-0.03em;font-weight:800;margin:0 0 8px}
.sub{color:var(--soft);font-size:16px;margin:0 auto;max-width:440px}
.search{display:flex;align-items:center;gap:10px;background:var(--row);border-radius:999px;padding:12px 18px;margin:0 0 14px}
.search svg{flex:none;width:17px;height:17px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;outline:none;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search:focus-within{box-shadow:0 0 0 2px var(--ink) inset}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li a{display:flex;align-items:center;gap:14px;background:var(--row);border-radius:14px;padding:10px 12px 10px 10px;transition:background .15s}
li a:hover,li a:focus-visible{background:var(--rowhover);outline:none}
.thumb{flex:none;width:46px;height:46px;border-radius:10px;object-fit:cover;object-position:50% 36%;background:#E6E6E6}
.txt{flex:1;min-width:0}
.title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-weight:700;font-size:15.5px;letter-spacing:-0.01em;line-height:1.28}
.line{display:block;margin-top:2px;font-size:13.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.04em;color:var(--ink);background:var(--green);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.go{flex:none;width:28px;height:28px;border-radius:999px;background:var(--green);display:grid;place-items:center}
.go svg{width:14px;height:14px}
.empty{padding:18px 4px;color:var(--soft);font-size:15px;text-align:center}
.join{margin:26px 0 0;text-align:center;font-size:15px;color:var(--soft)}
.join a{font-weight:700;color:var(--ink);border-bottom:2px solid var(--green);padding-bottom:1px}
.foot{margin:30px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}
/* Desktop (Kieran 2026-11-15: "on desktop, surely it should be wider"): a wider page, the search bar centred, rows in two columns. */
@media (min-width:860px){
  .wrap{max-width:1040px;padding:64px 32px 64px}
  header{margin:0 0 28px}
  .logo{width:60px;height:60px;border-radius:15px}
  h1{font-size:42px}
  .sub{font-size:17px;max-width:520px}
  .search{max-width:560px;margin:0 auto 26px}
  ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  li{min-width:0}
  li a{height:100%;padding:12px 16px 12px 12px;gap:16px}
  .thumb{width:58px;height:58px;border-radius:12px}
  .title{font-size:16px}
  .line{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="https://www.signalservice.ai" aria-label="Signal Service home"><img src="https://beehiiv-images-production.s3.amazonaws.com/uploads/publication/logo/803dd314-871f-405f-95c5-eb72ccbac17e/Signal_Service_Logo_-_Profile_Pic_800.png" alt="Signal Service"></a>
    <h1>Free guides from our videos</h1>
  </header>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg><input id="q" type="search" placeholder="Search guides" autocomplete="off" aria-label="Search guides"></label>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Nothing matches that. Try another word.</div>
  <p class="join">Just want the daily AI email? <a href="https://www.signalservice.ai/subscribe?utm_source=prompts&amp;utm_medium=bio">Join free</a></p>
  <p class="foot">AI moves fast - we make keeping up easy.</p>
</div>
<script>
const KITS = /*KITS*/[];
// 2026-11-20: a row whose date is still in the future stays hidden until that moment (UK time). So a guide can be published days ahead and joins the list by
// itself at the minute its reel goes out; nothing has to run at that time. (Kieran: the bio link only gets a guide once its reel is up.)
let UK_NOW;
try { const P = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(new Date()).map((p) => [p.type, p.value])); UK_NOW = `${P.year}-${P.month}-${P.day} ${P.hour}:${P.minute}`; }
catch (e) { UK_NOW = new Date().toISOString().slice(0, 16).replace("T", " "); }
const LIVE = KITS.filter((k) => !k.date || String(k.date).slice(0, 16) <= UK_NOW);
const KIT_HOST = "https://plan.signalservice.ai/"; // absolute, so the list works on any address that serves it
const list = document.getElementById("list"), q = document.getElementById("q"), empty = document.getElementById("empty");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
function draw(term){
  const words = term.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = LIVE.filter((k) => words.every((w) => (k.title + " " + k.line + " " + (k.tags || "")).toLowerCase().includes(w)));
  list.innerHTML = shown.map((k) => `<li><a href="${KIT_HOST}${encodeURIComponent(k.slug)}?utm_source=prompts&utm_medium=bio">` +
    `<img class="thumb" src="${esc(k.cover)}" alt="" loading="lazy"><span class="txt"><span class="title">${esc(k.title)}${k === LIVE[0] ? '<span class="new">NEW</span>' : ""}</span>` +
    `<span class="line">${esc(k.line)}</span></span><span class="go">${arrow}</span></a></li>`).join("");
  empty.hidden = shown.length > 0;
}
q.addEventListener("input", () => draw(q.value));
// ?q=cv opens the page already filtered (handy for a link that should land on one prompt).
q.value = new URLSearchParams(location.search).get("q") || "";
draw(q.value);
</script>
</body>
</html>
